name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  # ── Runs on schedule / manual trigger ─────────────────────────────────────
  # Generates the client from the latest OpenAPI spec and opens (or updates)
  # a PR for human review. Validation runs as a PR check, not here.
  update-client:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: update-client
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Load SSH Deploy Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry==2.1.3
          sudo apt-get update && sudo apt-get install -y jq
          npm install @openapitools/openapi-generator-cli -g

      - name: Generate client from latest OpenAPI spec
        run: |
          bash scripts/download_openapi_spec.sh
          bash scripts/generate_package.sh

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet rentcast_client/ && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push update branch and open PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="chore/update-api-client"
          git checkout -B "$BRANCH"
          git add rentcast_client/
          git commit -m "feat: update client to latest Rentcast API spec"
          git push --force origin "$BRANCH"

          # Open a PR if one doesn't exist, reopen if it was closed, otherwise
          # the force-push above already updated the existing open PR.
          PR_STATE=$(gh pr view "$BRANCH" --json state -q '.state' 2>/dev/null || echo "MISSING")
          if [[ "$PR_STATE" == "OPEN" ]]; then
            echo "PR already open — force-push updated it."
          elif [[ "$PR_STATE" == "CLOSED" ]]; then
            gh pr reopen "$BRANCH"
          else
            gh pr create \
              --title "feat: update client to latest Rentcast API spec" \
              --body "Automated update from the Rentcast OpenAPI spec. Please review the generated changes before merging." \
              --base main \
              --head "$BRANCH"
          fi

  # ── Runs on every PR targeting main ───────────────────────────────────────
  # Validates that the generated Python files are syntactically correct and
  # that the package can be imported. This is a required check before merge.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: validate-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry==2.1.3
          poetry install

      - name: Syntax check — compile all generated files
        run: |
          echo "Running py_compile on all rentcast_client files..."
          find rentcast_client/ -name "*.py" | xargs poetry run python -m py_compile
          echo "Syntax check passed."

      - name: Smoke test — import the package
        run: |
          echo "Verifying package can be imported..."
          poetry run python -c "import rentcast_client; print('Import OK')"

      - name: Run generated tests
        run: |
          poetry run pytest rentcast_client/rentcast_client/test/ -q

  # ── Runs on push to main (i.e. after a PR is merged) ──────────────────────
  # Validates the package then runs semantic-release and publishes to PyPI.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Load SSH Deploy Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry==2.1.3
          pip install python-semantic-release==9.8.0
          poetry install

      - name: Validate before release
        run: |
          echo "Running py_compile on all rentcast_client files..."
          find rentcast_client/ -name "*.py" | xargs poetry run python -m py_compile
          echo "Syntax check passed."
          poetry run python -c "import rentcast_client; print('Import OK')"
          poetry run pytest rentcast_client/rentcast_client/test/ -q

      - name: Release and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_PASSWORD }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin git@github.com:chutch3/rentcast-api-python-client.git
          if semantic-release version; then
            semantic-release publish
            poetry publish
          fi
