name: CI/CD Pipeline

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Base Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry==2.1.3

      # Step 1: Check for API Updates (Only on schedule or manual)
      - name: Update from OpenAPI Spec
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          npm install @openapitools/openapi-generator-cli -g
          bash scripts/download_openapi_spec.sh
          bash scripts/generate_package.sh

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rentcast_client/
          if ! git diff --staged --quiet; then
            git commit -m "feat: update client to latest Rentcast API spec"
            git push
          fi

      # Step 2: Release and Publish
      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v9.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        if: steps.release.outputs.released == 'true'
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_PASSWORD }}
        run: |
          poetry build
          poetry publish
